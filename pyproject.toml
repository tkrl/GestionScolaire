[project]
name = "inscription-univ"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tkrl", email = "justinlongin7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.1",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
]

[project.scripts]
inscription-univ = "inscription_univ:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "factory-boy>=3.3.3",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]
